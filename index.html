<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campo Minado💣</title>


    <style>

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #282c34;
            color: white;
            margin: 0;
            padding: 20px;
        }

        /*ESTILIZANDO TITULO*/
        h1 {
            margin-bottom: 20px; 
            color: #fff;
        }

        /*container do tabuleiro*/
    #game-container {
        display: grid;
        grid-template-columns: repeat(10,50px);
        grid-gap: 5px;
        background-color: #444;
        padding:10px;
        border-radius: 10px;
    }    
    .cell {
        width: 50px;
        height: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        background-color: #61dafb;
        border-radius: 5px;
        cursor: pointer;
        transition: transform 0.2,background-color 0.2;
        color: transparent;  
    }
    .cell:hover {
        transform: scale(1.2);
    }

    .cell.revealed{
        background-color: #b2f7ef;
        color: black;
    }

    .cell.bomb.revealed {
        background-color: #ff6f61;
        color: white;
    }



    </style>


</head>
<body>
    <h1>Campo Minado💣</h1>
    <div id="game-container">

    </div>
    <script>
        const gameContainer = document.getElementById("game-container")
        const rows = 10;
        const cols = 10;
        const bombCount = 14

        function createBoard(){
            const cells = []
            for(let i=0; i<rows*cols;i++){
                const cell = document.createElement("div")
                cell.classList.add("cell")
                cell.dataset.id = i
            
            gameContainer.appendChild(cell)
            cells.push(cell)
        }
           
            let  bombsPlaced = 0
            while(bombsPlaced<bombCount){
                const randomIndex = Math.floor(Math.random()*cells.length)
                if(!cells[randomIndex].classList.contains("bomb")){
                    cells[randomIndex].classList.add("bomb")
                    bombsPlaced++
                } 
            } 

            return cells;
        }
        function handCellClick(event){
            const cell = event.target
            if(cell.classList.contains("revealed")) return

            cell.classList.add("revealed")

            if(cell.classList.contains("bomb")){
                cell.innerHTML = "💣"
                revealAllBombs()
                alert("Game Over!")
            } else {
                const adjacentBombs = getAdjacentBombs(Number(cell.dataset.id))
                cell.innerHTML = adjacentBombs || ""
            }
            }
            function revealAllBombs(){
                cells.forEach((cell)=>{
                    if(cell.classList.contains("bomb")){
                        cell.classList.add("revealed")
                        cell.innerHTML = "💣"
                    }
                })
            }
            // fUNÇÃO PARA CALCULAR O NUMERO DE BOMBAS ADJACENTES
             function getAdjacentBombs(index){

    const row = Math.floor(index / cols)
    const col = index % cols

    let count = 0

    for(let r = row - 1; r <= row + 1; r++){

        for(let c = col - 1; c <= col + 1; c++){

            if(r >= 0 && r < rows && c >= 0 && c < cols){

                const neighborIndex = r * cols + c

                if(cells[neighborIndex].classList.contains("bomb")){
                    count++
                }
            }
        }
    }

    return count
}

            let cells = createBoard()
            cells.forEach((cell)=>cell.addEventListener("click",handCellClick))

    </script>
</body>
</html>
